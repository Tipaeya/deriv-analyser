<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Deriv Digit Terminal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { text-align: center; color: #4cc9f0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .card {
            background-color: #1c2541;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid #3a506b;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a506b;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .symbol-name { font-weight: bold; font-size: 1.1rem; color: #48cae4; }
        .last-digit { font-size: 2rem; font-weight: bold; text-align: center; }
        .stat-bar {
            display: flex;
            justify-content: space-between;
            margin: 12px 0 6px;
            font-size: 0.9rem;
        }
        .streak-alert {
            background-color: #7209b7;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<h2>Personal Multi-Index Digit Analyzer</h2>

<div class="grid" id="dashboard">
    <!-- Cards generated dynamically -->
</div>

<script>
    // Asset symbols on Deriv
    const symbols = [
        { name: 'Volatility 10 Index', symbol: 'R_10' },
        { name: 'Volatility 25 Index', symbol: 'R_25' },
        { name: 'Volatility 50 Index', symbol: 'R_50' },
        { name: 'Volatility 75 Index', symbol: 'R_75' },
        { name: 'Volatility 100 Index', symbol: 'R_100' }
    ];

    const state = {};
    const MAX_TICKS = 100;
    const STREAK_THRESHOLD = 5; // Alert if 5 consecutive Evens/Odds occur

    // Initialize Dashboard UI & State
    const container = document.getElementById('dashboard');
    symbols.forEach(s => {
        state[s.symbol] = { ticks: [], currentStreak: { type: null, count: 0 } };

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <span class="symbol-name">${s.name}</span>
            </div>
            <div class="last-digit" id="digit-${s.symbol}">-</div>
            <div class="stat-bar">
                <span>EVEN: <b id="even-${s.symbol}" style="color:#4ade80">0%</b></span>
                <span>ODD: <b id="odd-${s.symbol}" style="color:#f87171">0%</b></span>
            </div>
            <div class="streak-alert" id="alert-${s.symbol}"></div>
        `;
        container.appendChild(card);
    });

    // Connect to Deriv WebSocket
    const socket = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

    socket.onopen = () => {
        // Subscribe to all target indices
        symbols.forEach(s => {
            socket.send(JSON.stringify({ ticks: s.symbol }));
        });
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.msg_type === 'tick') {
            const sym = data.tick.symbol;
            const price = data.tick.quote;
            const priceStr = price.toFixed(data.tick.pip_size);
            const digit = parseInt(priceStr.slice(-1));

            // Update state
            const assetState = state[sym];
            assetState.ticks.push(digit);
            if (assetState.ticks.length > MAX_TICKS) assetState.ticks.shift();

            // Check Streak
            const type = digit % 2 === 0 ? 'EVEN' : 'ODD';
            if (assetState.currentStreak.type === type) {
                assetState.currentStreak.count++;
            } else {
                assetState.currentStreak = { type: type, count: 1 };
            }

            // Update UI UI Elements
            document.getElementById(`digit-${sym}`).innerText = `${digit} (${type})`;

            const evens = assetState.ticks.filter(d => d % 2 === 0).length;
            const total = assetState.ticks.length;
            const evenPct = ((evens / total) * 100).toFixed(0);
            const oddPct = (100 - evenPct).toFixed(0);

            document.getElementById(`even-${sym}`).innerText = `${evenPct}%`;
            document.getElementById(`odd-${sym}`).innerText = `${oddPct}%`;

            // Handle Streak Alert
            const alertBox = document.getElementById(`alert-${sym}`);
            if (assetState.currentStreak.count >= STREAK_THRESHOLD) {
                alertBox.style.display = 'block';
                alertBox.innerText = `⚠️ Streak Alert: ${assetState.currentStreak.count} ${assetState.currentStreak.type}s in a row!`;
            } else {
                alertBox.style.display = 'none';
            }
        }
    };
</script>

</body>
</html>
